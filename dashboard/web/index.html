<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>bernie</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/views.css">
<!-- The stylesheet of a tab that is not the first one comes with its files:
     the manifest of js/boot.js names it. -->
<link rel="icon" href="data:,">
</head>
<body class="shell">
  <a class="skip" href="#main">Skip to the content</a>
  <aside class="rail">
    <div class="brand">
      <span class="brand-line"><span class="brand-mark" aria-hidden="true"></span><a class="logo" href="#setup">bernie</a></span>
      <span id="hostname" class="host muted"></span>
      <span id="gpunote" class="host muted"></span>
    </div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="The tabs of the dashboard">
      <a id="tab-setup" role="tab" href="#setup" data-tab="setup" aria-controls="panel-setup" aria-selected="true" tabindex="0"><span class="ico" aria-hidden="true">◆</span>Setup<span class="tab-count" data-count="setup" hidden></span></a>
      <a id="tab-dashboard" role="tab" href="#dashboard" data-tab="dashboard" aria-controls="panel-dashboard" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">▲</span>Dashboard<span class="tab-count" data-count="dashboard" hidden></span></a>
      <a id="tab-chat" role="tab" href="#chat" data-tab="chat" aria-controls="panel-chat" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">✉</span>Chat</a>
      <a id="tab-benchmark" role="tab" href="#benchmark" data-tab="benchmark" aria-controls="panel-benchmark" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">■</span>Benchmark</a>
      <a id="tab-topology" role="tab" href="#topology" data-tab="topology" aria-controls="panel-topology" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">✚</span>Topology<span class="tab-count" data-count="topology" hidden></span></a>
      <a id="tab-fleet" role="tab" href="#fleet" data-tab="fleet" aria-controls="panel-fleet" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">▦</span>Fleet</a>
      <a id="tab-logs" role="tab" href="#logs" data-tab="logs" aria-controls="panel-logs" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">≡</span>Logs</a>
      <a id="tab-advanced" role="tab" href="#advanced" data-tab="advanced" aria-controls="panel-advanced" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">★</span>Advanced</a>
    </nav>
    <div class="rail-foot">
      <span id="runpill" class="pill skip" role="status" title="No run is serving on this host." aria-label="idle — No run is serving on this host."><span class="pill-icon">–</span><span class="pill-word">idle</span></span>
      <span id="pillage" class="pill-age muted">no data yet</span>
      <div class="rail-buttons">
        <button id="themeBtn" class="ghost small" type="button" aria-pressed="false" aria-label="Switch to the light palette">Light</button>
        <button id="advancedBtn" class="ghost small" type="button" aria-pressed="false" aria-label="Show the details of every tab" title="Show the technical detail inside every tab">Show details</button>
        <button id="helpBtn" class="ghost small" type="button" aria-label="The keyboard shortcuts">?</button>
      </div>
    </div>
  </aside>
  <main id="main" class="content" tabindex="-1">
    <section id="panel-setup" class="panel" role="tabpanel" aria-labelledby="tab-setup" data-tab-panel="setup" hidden></section>
    <section id="panel-dashboard" class="panel" role="tabpanel" aria-labelledby="tab-dashboard" data-tab-panel="dashboard" hidden></section>
    <section id="panel-chat" class="panel" role="tabpanel" aria-labelledby="tab-chat" data-tab-panel="chat" hidden></section>
    <section id="panel-benchmark" class="panel" role="tabpanel" aria-labelledby="tab-benchmark" data-tab-panel="benchmark" hidden></section>
    <section id="panel-topology" class="panel" role="tabpanel" aria-labelledby="tab-topology" data-tab-panel="topology" hidden></section>
    <section id="panel-fleet" class="panel" role="tabpanel" aria-labelledby="tab-fleet" data-tab-panel="fleet" hidden></section>
    <section id="panel-logs" class="panel" role="tabpanel" aria-labelledby="tab-logs" data-tab-panel="logs" hidden></section>
    <section id="panel-advanced" class="panel advanced" role="tabpanel" aria-labelledby="tab-advanced" data-tab-panel="advanced" hidden></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="js/core.js"></script>
<script src="components/command.js"></script>
<script src="components/cards.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script src="components/timeline.js"></script>
<script src="views/setup/setup.js"></script>
<script src="views/setup/headline.js"></script>
<script src="views/setup/facts.js"></script>
<script src="views/setup/glossary.js"></script>
<script src="views/setup/steps.js"></script>
<script src="views/setup/recipes.js"></script>
<script src="js/boot.js"></script>
<!-- The files of the other tabs come when their tab opens for the first
     time: the manifest of js/boot.js names them. -->
</body>
</html>

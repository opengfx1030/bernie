name: Host report
description: rdnactl does not work (or works) on my machine
labels: [host-report]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command, expected result, actual result.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: rdnactl doctor --json
      render: json
    validations:
      required: true
  - type: textarea
    id: hw
    attributes:
      label: rdnactl hw --json
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rdnactl version
    validations:
      required: true

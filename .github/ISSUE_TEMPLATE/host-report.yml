name: Host report
description: bernie does not work (or works) on my machine
labels: [host-report]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command, expected result, actual result.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: bernie doctor --json
      render: json
    validations:
      required: true
  - type: textarea
    id: hw
    attributes:
      label: bernie hw --json
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bernie version
    validations:
      required: true

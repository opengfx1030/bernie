name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt + vet
        run: make lint
      - name: test
        run: go test -race ./...
      - name: linux static build
        run: make linux
      - name: smoke
        run: |
          ./bin/bernie-linux-amd64 version
          ./bin/bernie-linux-amd64 --json recipe validate
          ./bin/bernie-linux-amd64 --json hw > /dev/null
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Builds archives, rpm/deb and the container image (no push) when a pull
  # request touches packaging, the Makefile, the installer or these workflows.
  packaging:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: changed packaging files?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" |
            grep -Eq '^(deploy/|Makefile$|scripts/install\.sh$|\.github/workflows/(ci|release)\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: archives and packages
        if: steps.changed.outputs.run == 'true'
        run: |
          make dist packages
          ls -l dist
          ./dist/bernie-linux-amd64 version
          sudo apt-get install -y --no-install-recommends rpm >/dev/null
          for f in dist/*.deb; do dpkg-deb -c "$f"; done
          for f in dist/*.rpm; do rpm -qpl "$f"; done
      - name: compose file
        if: steps.changed.outputs.run == 'true'
        run: docker compose -f deploy/compose/compose.yml config -q
      - uses: docker/setup-buildx-action@v4
        if: steps.changed.outputs.run == 'true'
      - name: image (no push)
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

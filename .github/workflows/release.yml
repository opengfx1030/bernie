name: release

# On a version tag: test, build static binaries, archives and rpm/deb, sign
# SHA256SUMS (keyless cosign), publish the GitHub release and the image.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: binaries, archives, rpm, deb, SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: make dist packages VERSION="$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing (Sigstore OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: sigstore/cosign-installer@v3
      - name: sign SHA256SUMS
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.bundle SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --generate-notes $prerelease

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/opengfx1030/bernie
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=bernie
            org.opencontainers.image.description=Run vLLM on AMD ROCm GPUs: CLI and web dashboard
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

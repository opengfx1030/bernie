schema: 1
name: Triton attention
description: TRITON_ATTN backend with the Triton AMD flash-attention path; FA-RDNA2 off.
env:
  VLLM_USE_RDNA2_FA: "0"
  FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
args:
  attention-backend: TRITON_ATTN

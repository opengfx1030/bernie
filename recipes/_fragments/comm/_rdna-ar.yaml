# Ported from opengfx1030/vllm-rdna (rdna_extras) tools/rdna by bernie.
#
# rdna_ar: the fork's one-shot all-reduce. One-shot up to 64 KiB, RCCL above;
# two-shot is not boot-safe under PCIe load. Without PCIe P2P (the fork's
# P2P=0), set env.VLLM_RDNA_AR=0 and env.NCCL_P2P_DISABLE=1.
schema: 1
name: RDNA one-shot all-reduce
description: Fork all-reduce (rdna_ar) for messages up to 64 KiB; RCCL above.
env:
  VLLM_RDNA_AR: "1"
  VLLM_RDNA_AR_MAX_KB: "64"
  VLLM_RDNA_AR_ONESHOT_KB: "64"

why:
  env.VLLM_RDNA_AR: "Uses the fork's one-shot all-reduce for the small messages common in decode."
  env.VLLM_RDNA_AR_MAX_KB: "Caps the custom all-reduce at 64 KiB; larger messages use RCCL."
  env.VLLM_RDNA_AR_ONESHOT_KB: "Keeps the one-shot kernel at its boot-safe 64 KiB limit."

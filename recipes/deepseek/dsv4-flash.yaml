# Ported from opengfx1030/vllm-rdna (rdna_extras) tools/rdna by rdnactl.
#
# DeepSeek-V4-Flash (K128) on gfx1030: fp8 dense + MXFP4 experts
# (I8 [N, K/2] + F8_E8M0 [N, K/32] scales -> MXF4_RDNA2 MoE).
# Fork recipe: tools/rdna/recipes/dsv4-flash.env. Based on the fork's
# docs/fixes/2026-08-14-deepseek-v4-k128-recipe.md (TP=4, 32k, fp8 KV),
# fp16 attention via DeepseekV4RDNAAttention (no attention-backend flag).
#
# Cudagraphs: the AMD DeepSeek-V4 model has no torch.compile'd submodule,
# so piecewise capture comes from breakable CUDA graphs: FULL_AND_PIECEWISE
# captures the model with the sparse indexer and MLA attention as eager
# breaks (VLLM_USE_BREAKABLE_CUDAGRAPH=1). With it off, the runner silently
# drops to cudagraph_mode NONE.
#
# The checkpoint is a 50%-pruned repack: judge correctness with the fork's
# tools/rdna/port_v031/ppl_probe.py (perplexity ~8.4), not exact answers.
#
# KV budget (TP=4, 4x V620): model 20.73 GiB of 29.4 GiB free; KV=6e9
# (5.59 GiB) holds 107,892 tokens. The compressed/sliding V4 cache grows far
# slower than context: 8 concurrent 16k+1k requests peak at ~40% of it, so
# 8 sequences run c=8 without queueing (4e9 would sit at ~64%).
#
# Override any key, e.g. TP=8:
#   rdnactl serve dsv4-flash --set MODEL=/models/dsv4-k128 \
#     --set args.tensor-parallel-size=8 --set requires.gpus=8
schema: 1
extends: [_base, _rdna-ar, _rccl-pcie, _tuned-moe]
name: DeepSeek-V4-Flash K128 (fp8 + MXFP4 experts), TP4
description: >-
  DeepSeek-V4-Flash K128 50%-pruned repack (fp8 dense, MXFP4 experts) on 4x
  gfx1030 with fp8 KV cache, 32K context and breakable FULL_AND_PIECEWISE
  graphs. Judge output by perplexity (~8.4). Needs a local checkpoint.
status: experimental
priority: 5
tags: [deepseek, moe, mxfp4, fp8]

model:
  source: ${MODEL}
  served_name: dsv4-flash

inputs:
  MODEL:
    description: DeepSeek-V4-Flash K128 repack directory (fp8 dense + MXFP4 experts)
    required: true
    path: true

requires:
  gpus: 4
  vram_gib: 28

env:
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_AOT_COMPILE: "0"
  VLLM_DISABLE_COMPILE_CACHE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
  VLLM_FORCE_CUSTOM_ALL_REDUCE: "0"
  OMP_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONFAULTHANDLER: "1"

args:
  port: 18300
  max-model-len: 32768
  max-num-seqs: 8
  max-num-batched-tokens: 2048
  kv-cache-memory-bytes: 6000000000
  gpu-memory-utilization: 0.90
  compilation-config:
    cudagraph_mode: FULL_AND_PIECEWISE
    compile_ranges_endpoints: []
  # FEATURES="language-model-only skip-mm-profiling trust-remote-code"
  language-model-only: true
  skip-mm-profiling: true
  trust-remote-code: true
  # EXTRA_ARGS="--kv-cache-dtype fp8"
  kv-cache-dtype: fp8

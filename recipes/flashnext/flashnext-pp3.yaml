# Ported from opengfx1030/vllm-rdna (rdna_extras) tools/rdna by rdnactl.
#
# Flash-Next AWQ-W4A16, MTP=0, pipeline-parallel over 3 gfx1030 cards (TP1/PP3).
# Fork recipe: tools/rdna/recipes/flashnext-pp3.env.
# Validated on 3x Radeon PRO V620 (venv-7.14.0, rocm7.14-rocblas5.5 TunableOp).
# Profile follows alanoo81/flashnext-v620-pp3 (text-only, 262K, KV sized from
# free memory); flashnext-pp3-mtp2 is the speculative variant.
# PLE layers must sit on stage 0 (Flash-Next: layer 2, any sane partition).
# Stage 0 holds the whole PLE table: PLE=bf16 needs ~95 GB host RAM; this
# recipe uses PLE=int4 with PLE_QUANT_DIR (see _ple-int4.yaml for int4-disk).
# Dense INT8 must run in ONLY mode under PP: keeping the fp16 copy next to
# the int8 shadow OOMs a stage.
# Text-only: the vision encoder sits on stage 0 and its profiling pass does
# not fit next to 16 layers; vision under PP3 is not supported.
# Host mode only: pipeline parallel for this model is not in the
# v0.31.0-extras image.
#
#   rdnactl serve flashnext-pp3 --set PLE_QUANT_DIR=/path/to/ples_int4
schema: 1
extends: [_flashnext-common]
name: Qwen3.8 Flash-Next AWQ-W4A16, MTP=0, TP1/PP3
description: >-
  Flash-Next AWQ-W4A16 pipeline-parallel over 3 gfx1030 cards (layers
  16,16,16), dense INT8 only, text only, 262K context, KV cache sized from
  95 % of GPU memory. Validated on 3x Radeon PRO V620. Host mode only.
status: validated
priority: 25
entrypoint: api
tags: [qwen, flash-next, moe, awq, pipeline-parallel]

requires:
  gpus: 3

container: null

env:
  VLLM_PP_LAYER_PARTITION: "16,16,16"
  VLLM_RDNA_DENSE_INT8: "1"
  VLLM_RDNA_DENSE_INT8_ONLY: "1"
  # The fork's launcher default (the TP4 profile uses 4).
  GPU_MAX_HW_QUEUES: "2"

args:
  tensor-parallel-size: 1
  pipeline-parallel-size: 3
  # KV=auto: vLLM sizes the cache from --gpu-memory-utilization.
  kv-cache-memory-bytes: null
  gpu-memory-utilization: 0.95
  # FEATURES="prefix-caching mamba-align language-model-only skip-mm-profiling"
  enable-expert-parallel: null
  limit-mm-per-prompt: null
  mm-processor-kwargs: null
  language-model-only: true
  skip-mm-profiling: true

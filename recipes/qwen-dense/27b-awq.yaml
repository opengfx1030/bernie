# Ported from opengfx1030/vllm-rdna (rdna_extras) tools/rdna by bernie.
#
# Qwen3.8-27B AWQ-INT4 (compressed-tensors W4A16, dense hybrid GDN) on gfx1030.
# Fork recipe: tools/rdna/recipes/27b-awq.env. Reference:
# tools/rdna/serve_gfx1030_27b_dense.sh. No max-model-len (the model's own
# context is used), FA-RDNA2 attention, RDNA2 W4A16/W4A8 GEMMs, prefix
# caching, FULL_AND_PIECEWISE graphs.
#
# W4A8 (VLLM_RDNA2_W4A8_SDOT4=1): int8-activation prefill GEMMs (M >= 33;
# decode stays W4A16). Measured 2026-10-25 (4x V620 TP=4 F&P, HIP 6-9, one
# boot, raw PASS, same recipe and decode-stall cap on both sides): the fitted
# prefill cost drops from 0.94-1.15 to 0.70-0.93 ms/token, the 16k c=1
# prefill rate goes 860 -> 1075 tok/s (TTFT 19.1 -> 15.2 s) and the 16k c=8
# aggregate output 42.5 -> 52.3 tok/s (TTFT 48.8 -> 34.4 s). Quality is
# unchanged: paired PPL 4.94 -> 4.91, greedy 3/3 on both sides. The W4A8
# path is active on every rank (the serve log says "RDNA2 W4A8 sdot4 path
# active"). The same lever on v0.31 (2026-10-09) gave byte-identical greedy
# output and PPL 4.90 vs 4.94.
# Set --set env.VLLM_RDNA2_W4A8_SDOT4=0 to fall back to the W4A16 prefill GEMMs.
# The v0.31.0-extras image predates W4A8; in container mode the variable has
# no effect and prefill runs W4A16.
#
# max-num-batched-tokens: the fork launcher derives it from the KV/SSM dtype.
# The prefill chunk ends on a mamba state block boundary, so the budget must
# cover two blocks: 2048 for an FP16 KV cache (block 1024, this recipe), 4096
# for a packed KV cache with an FP16 SSM state (block 2048), 6144 for a packed
# KV cache with the model's own FP32 state (block 3072). If you set
#   --set args.kv-cache-dtype=int4_fp16_block
# also set --set args.max-num-batched-tokens=6144 (or 4096 together with
# --set args.mamba-ssm-cache-dtype=float16).
#
# Decode-stall cap (dense hybrid): off here. With the prefill budget derived
# from the mamba state block, the cap only chunks the prefill below that
# boundary. Measured 2026-10-25 (4x V620 TP=4 F&P, HIP 6-9, one boot, raw
# PASS): the cap costs 12-19 % TTFT at c=8 (1k FP16 KV 1.96 -> 1.62 s, 16k
# INT4 KV 39.53 -> 34.89 s) for 0-2.5 % output; the c=1 cells are within
# noise. It does bound the decode gap during a long prefill (on the INT4 KV
# cache the worst-request mean ITL at 16k c=8 grows 415 -> 503 ms with the cap
# off). Set a positive value to trade TTFT for that bound.
# (fork docs/rdna2/mixed-batch-stall-probe.md)
schema: 1
extends: [_base, _rdna2, _attn-fa, _rdna-ar, _tuned-moe]
name: Qwen3.8-27B AWQ-INT4 dense, W4A8 prefill, TP4
description: >-
  Qwen3.8-27B AWQ-INT4 (compressed-tensors W4A16, dense hybrid GDN) on 4x
  gfx1030 with FA-RDNA2, W4A8 int8-activation prefill GEMMs, prefix caching
  and FULL_AND_PIECEWISE graphs. Measured 2026-10-25 on 4x Radeon PRO V620:
  PPL 4.91, greedy 3/3.
status: validated
priority: 30
tags: [qwen, dense, awq, w4a8]

model:
  source: cyankiwi/Qwen3.8-27B-AWQ-INT4
  served_name: q27d

requires:
  gpus: 4
  vram_gib: 28

env:
  VLLM_RDNA2_W4A8_SDOT4: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  # AOT compile hands rank 0's compiled graph to the other ranks on the
  # qwen3_next path (TP all-reduce input on cuda:0; same on 0.28). Per-rank JIT.
  VLLM_USE_AOT_COMPILE: "0"
  VLLM_DISABLE_COMPILE_CACHE: "1"
  VLLM_RDNA_FUSED_SE: "1"
  VLLM_RDNA_DENSE_INT8: "0"
  VLLM_RDNA_DENSE_INT8_ONLY: "0"
  VLLM_RDNA_DENSE_GEMV: "0"
  # One-shot up to 64 KiB, RCCL above; the stock custom-AR force flag stays off.
  VLLM_FORCE_CUSTOM_ALL_REDUCE: "0"
  VLLM_RDNA_AR_BLOCKS: "0"
  VLLM_RDNA_AR_PACE: "0"
  HSA_FORCE_FINE_GRAIN_PCIE: "1"
  HSA_ENABLE_SDMA: "0"
  OMP_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONFAULTHANDLER: "1"
  VLLM_ENABLE_STARTUP_PLAN: "0"
  VLLM_RDNA_DECODE_STALL_MS: "0"

args:
  port: 18210
  block-size: 1024
  max-num-seqs: 8
  max-num-batched-tokens: 2048
  kv-cache-memory-bytes: 8000000000
  gpu-memory-utilization: 0.9
  compilation-config:
    cudagraph_mode: FULL_AND_PIECEWISE
    cudagraph_capture_sizes: [1, 2, 4, 8]
    compile_ranges_endpoints: []
  # FEATURES="prefix-caching mamba-align language-model-only vision-cap"
  enable-prefix-caching: true
  mamba-cache-mode: align
  language-model-only: true
  limit-mm-per-prompt: {image: 1}
  mm-processor-kwargs: {max_pixels: 1605632}

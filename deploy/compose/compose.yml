# Reference Compose file: the bernie dashboard in a container.
# Works with `docker compose`, `podman compose` and `podman-compose`.
#
#   cp .env.example .env     # set BERNIE_DASH_TOKEN and the group ids
#   mkdir -p data && sudo chown 65532:65532 data
#   docker compose up -d     # then open http://127.0.0.1:7860
#
# What the container can do: hw, topo, doctor, recipes, bench and the dashboard.
# It cannot start vLLM as a host process (no Python venv in the image), and the
# image holds no docker/podman CLI, so `serve` in container mode needs a
# derived image that adds one. Use the host binary for `bernie serve`.
# See docs/install.md.
name: bernie
services:
  bernie:
    image: ghcr.io/opengfx1030/bernie:${BERNIE_TAG:?set BERNIE_TAG to a release tag, see .env.example}
    container_name: bernie-dash
    # Default command: dash --listen 0.0.0.0:7860. A non-loopback address
    # requires a token. Empty BERNIE_DASH_TOKEN = random token in `logs`.
    environment:
      BERNIE_DASH_TOKEN: ${BERNIE_DASH_TOKEN:-}
    ports:
      # Loopback only by default. Set BERNIE_BIND=0.0.0.0 to expose the
      # dashboard to the network; then the token is the only protection.
      - "${BERNIE_BIND:-127.0.0.1}:7860:7860"
    devices:
      - /dev/kfd
      - /dev/dri
    # The image has no /etc/group: a group name does not resolve there.
    # Use the numeric ids of the GPU groups of THIS host.
    #   getent group video      -> VIDEO_GID
    #   getent group render     -> RENDER_GID
    #   stat -c %g /dev/kfd /dev/dri/renderD128 /dev/dri/card0
    group_add:
      - "${VIDEO_GID:?set VIDEO_GID to the numeric id of the video group}"
      - "${RENDER_GID:?set RENDER_GID to the numeric id of the render group}"
    security_opt:
      - label=disable
      - seccomp=unconfined
    volumes:
      - ./data:/data
      - /sys:/sys:ro
      # Container-mode runs need an engine CLI inside the container (not in
      # this image) and the engine socket. The socket is root on the host:
      # see SECURITY.md before you enable it.
      # - /var/run/docker.sock:/var/run/docker.sock
      # - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock
    restart: unless-stopped

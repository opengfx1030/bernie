# Reference Compose file for bernie (docs/spec.md 8.2).
# It is `bernie compose flashnext-mtp2` with the host paths replaced by
# variables. Prefer `bernie compose <recipe> -o compose.yml`: it selects the
# GPUs, mounts the path inputs and the TunableOp rows of this host.
#
# Variables:
#   PLE_QUANT_DIR        ples_int4 directory (has META.json) of
#                        primitive-ai/Qwen3.8-Flash-Next-PLE-quant. Required.
#   HIP_VISIBLE_DEVICES  four gfx1030 GPUs on one PCIe switch (`bernie topo`).
#   HF_CACHE             Hugging Face cache (default ~/.cache/huggingface).
#   BERNIE_TUNABLEOP    materialized TunableOp rows: run
#                        `bernie tune tunableop env --profile rocm7.14-rocblas5.5` once.
#
# Start: docker compose -f compose.yml up -d   (or podman compose / podman-compose)
# Rootless Podman: replace group_add with [keep-groups].
name: bernie-flashnext-mtp2
services:
  vllm:
    image: docker.io/blivioniag/vllm-rdna:v0.31.0-extras
    container_name: bernie-flashnext-mtp2
    labels:
      bernie.run: flashnext-mtp2
    network_mode: host
    ipc: host
    shm_size: 16g
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
      - label=disable
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - ${BERNIE_TUNABLEOP:-${HOME}/.local/share/bernie/tunableop}:/bernie/tunableop:ro
      - ${PLE_QUANT_DIR:?set PLE_QUANT_DIR to the ples_int4 directory}:/bernie/ple:ro
    environment:
      FLASH_ATTENTION_TRITON_AMD_ENABLE: ""
      GPU_MAX_HW_QUEUES: "4"
      HF_HUB_OFFLINE: "0"
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-0,1,2,3}
      HSA_ENABLE_SDMA: "0"
      HSA_FORCE_FINE_GRAIN_PCIE: "1"
      OMP_NUM_THREADS: "4"
      PYTHONFAULTHANDLER: "1"
      PYTORCH_TUNABLEOP_ENABLED: "1"
      PYTORCH_TUNABLEOP_FILENAME: /bernie/tunableop/rocm7.14-rocblas5.5/tunableop_results.csv
      PYTORCH_TUNABLEOP_HIPBLASLT_ENABLED: "0"
      PYTORCH_TUNABLEOP_TUNING: "0"
      ROCPROFILER_REGISTER_ENABLED: "0"
      TOKENIZERS_PARALLELISM: "false"
      TORCH_BLAS_PREFER_HIPBLASLT: "0"
      TRANSFORMERS_OFFLINE: "0"
      VLLM_BATCH_INVARIANT: "0"
      VLLM_CAUSAL_CONV1D_RDNA2_FWD: "0"
      VLLM_CAUSAL_CONV1D_RDNA2_UPDATE: "0"
      VLLM_ENABLE_STARTUP_PLAN: "0"
      VLLM_FA_RDNA2_GQA_DECODE: "1"
      VLLM_GDN_HIP_PREFILL: "1"
      VLLM_PLE_QUANT_DIR: /bernie/ple
      VLLM_RDNA_AR: "1"
      VLLM_RDNA_AR_BLOCKS: "0"
      VLLM_RDNA_AR_MAX_KB: "64"
      VLLM_RDNA_AR_ONESHOT_KB: "64"
      VLLM_RDNA_AR_PACE: "0"
      VLLM_RDNA_DENSE_GEMV: "0"
      VLLM_RDNA_DENSE_INT8: "0"
      VLLM_RDNA_DENSE_INT8_ONLY: "0"
      VLLM_RDNA_FUSED_SE: "1"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_ROCM_USE_AITER_MOE: "0"
      VLLM_TUNED_CONFIG_FOLDER: /src/vllm/tuned-moe
      VLLM_USE_RDNA2_FA: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model
      - wtdcode/Qwen3.8-Flash-Next-AWQ-W4A16
      - --attention-backend
      - RDNA_ATTN
      - --block-size
      - "1024"
      - --compilation-config
      - '{"compile_ranges_endpoints":[],"cudagraph_capture_sizes":[3,6,12,24],"cudagraph_mode":"FULL_AND_PIECEWISE","mode":3}'
      - --dtype
      - float16
      - --enable-expert-parallel
      - --enable-prefix-caching
      - --host
      - 127.0.0.1
      - --kv-cache-memory-bytes
      - "4026531840"
      - --limit-mm-per-prompt
      - '{"image":1}'
      - --long-prefill-token-threshold
      - "0"
      - --mamba-cache-mode
      - align
      - --max-model-len
      - "262144"
      - --max-num-batched-tokens
      - "2048"
      - --max-num-seqs
      - "8"
      - --mm-processor-kwargs
      - '{"max_pixels":1605632}'
      - --port
      - "18096"
      - --prefill-schedule-interval
      - "1"
      - --served-model-name
      - flash-next
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2,"use_local_argmax_reduction":true}'
      - --tensor-parallel-size
      - "4"
    restart: "no"

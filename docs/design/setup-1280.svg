<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-label="The Setup tab at 1280 px">
<title>The Setup tab at 1280 px</title>
<desc>The machine that is three steps away from serving.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="1280" height="900" rx="0" class="bg"/>
<line x1="220" y1="0" x2="220" y2="900" class="ln"/>
<text x="24" y="44" class="t bd" text-anchor="start" style="font-size:15px;font-weight:800">bernie</text>
<text x="24" y="64" class="t sm" text-anchor="start">gpu-box</text>
<line x1="24" y1="92" x2="196" y2="92" class="ln"/>
<rect x="14" y="94" width="192" height="30" rx="8" class="sf3"/>
<rect x="14" y="94" width="3" height="30" rx="0" class="acc"/>
<text x="24" y="116" class="t bd" text-anchor="start" style="font-size:13px;font-weight:700">Setup</text>
<text x="24" y="150" class="t sb" text-anchor="start" style="font-size:13px">Dashboard</text>
<text x="24" y="184" class="t sb" text-anchor="start" style="font-size:13px">Benchmark</text>
<text x="24" y="218" class="t sb" text-anchor="start" style="font-size:13px">Logs</text>
<line x1="24" y1="100" x2="196" y2="100" class="ln"/>
<rect x="24" y="122" width="86" height="22" rx="11" class="sf" stroke="#1a7a33" stroke-width="1"/>
<circle cx="36" cy="133" r="4" class="ok"/>
<text x="46" y="138" class="t ok" text-anchor="start" style="font-size:11px">serving</text>
<rect x="24" y="154" width="52" height="24" rx="6" class="sf" stroke="#828a93"/>
<text x="50" y="170" class="t sb" text-anchor="middle" style="font-size:11px">Dark</text>
<rect x="84" y="154" width="80" height="24" rx="6" class="sf" stroke="#828a93"/>
<text x="124" y="170" class="t sb" text-anchor="middle" style="font-size:11px">Advanced</text>
<text x="276" y="56" class="t h2" text-anchor="start">SETUP</text>
<text x="279" y="108.0" class="t acc" text-anchor="start" style="font-size:34px;font-weight:900;letter-spacing:-.02em">3 STEPS LEFT BEFORE THIS BOX CAN SERVE</text>
<text x="276" y="108.0" class="t h1" text-anchor="start" style="font-size:34px">3 STEPS LEFT BEFORE THIS BOX CAN SERVE</text>
<text x="276" y="136.0" class="t sb" text-anchor="start" style="font-size:15px">The venv, the ROCm wheels and the model are not there yet. Two steps need root; you will run those yourself.</text>
<rect x="279" y="159.0" width="190" height="34" rx="8" class="acc"/>
<rect x="276" y="156.0" width="190" height="34" rx="8" class="acc"/>
<text x="371.0" y="178.0" class="t onacc" text-anchor="middle" style="font-size:12px;font-weight:800;letter-spacing:.08em">SET UP THIS MACHINE</text>
<rect x="476" y="158.0" width="150" height="30" rx="8" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="551.0" y="178.0" class="t sb" text-anchor="middle">COPY THE COMMAND</text>
<rect x="636" y="158.0" width="110" height="30" rx="8" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="691.0" y="178.0" class="t sb" text-anchor="middle">ADVANCED</text>
<rect x="276" y="190" width="948" height="150" rx="18" class="sf" stroke="#dfe3e8"/>
<text x="296" y="222" class="t sb" text-anchor="start">bernie picked the setup that fits this host.</text>
<text x="296" y="244" class="t sm" text-anchor="start">Anything that needs a password is shown as a command to paste.</text>
<text x="296" y="276" class="t sm" text-anchor="start">The recipe is Qwen3.8 Flash-Next AWQ with 4 cards of gfx1030 behind one switch.</text>
<text x="760" y="218" class="t lbl" text-anchor="start">GPUs</text>
<text x="760" y="238" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">8 x Radeon PRO V620</text>
<text x="760" y="254" class="t sm" text-anchor="start">one recipe family fits them all</text>
<text x="0" y="218" class="t lbl" text-anchor="start">Memory</text>
<text x="0" y="238" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">240 GiB</text>
<text x="0" y="254" class="t sm" text-anchor="start">28 GiB per card, the rest is the KV cache</text>
<text x="0" y="218" class="t lbl" text-anchor="start">ROCm</text>
<text x="0" y="238" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">7.14.0</text>
<text x="0" y="254" class="t sm" text-anchor="start">the one on PATH wins</text>
<text x="0" y="218" class="t lbl" text-anchor="start">Engine</text>
<text x="0" y="238" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">docker 29.9.0</text>
<text x="0" y="254" class="t sm" text-anchor="start">the image is used</text>
<line x1="276" y1="378" x2="1224" y2="378" class="ln"/>
<text x="276" y="400" class="t lbl" text-anchor="start">THE PATH TO A SERVING MODEL</text>
<circle cx="294" cy="458" r="18" class="sf2"/>
<text x="294" y="462" class="t ok" text-anchor="middle" style="font-size:12px;font-weight:800">✓</text>
<line x1="294" y1="478" x2="294" y2="526" class="ln" stroke-width="2"/>
<text x="330" y="454" class="t bd" text-anchor="start" style="font-weight:700">The cards are there</text>
<text x="330" y="474" class="t sb" text-anchor="start">Every card is gfx1030 and /dev/kfd is readable.</text>
<rect x="330" y="470" width="92" height="26" rx="6" class="sf" stroke="#828a93"/>
<text x="376" y="487" class="t sb" text-anchor="middle" style="font-size:11px">Run again</text>
<circle cx="294" cy="548" r="18" class="sf2"/>
<text x="294" y="552" class="t warn" text-anchor="middle" style="font-size:12px;font-weight:800">!</text>
<line x1="294" y1="568" x2="294" y2="616" class="ln" stroke-width="2"/>
<text x="330" y="544" class="t bd" text-anchor="start" style="font-weight:700">Join the video and render groups</text>
<text x="330" y="564" class="t sb" text-anchor="start">This step needs root. Run it in a terminal, then re-check.</text>
<rect x="330" y="556" width="420" height="34" rx="8" class="sf2" stroke="#dfe3e8"/>
<text x="341" y="577" class="mn sb" text-anchor="start">sudo usermod -aG video,render $USER</text>
<rect x="688" y="562" width="52" height="22" rx="6" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="714" y="577" class="t sb" text-anchor="middle" style="font-size:11px">Copy</text>
<circle cx="294" cy="658" r="18" class="sf2"/>
<text x="294" y="662" class="t info" text-anchor="middle" style="font-size:12px;font-weight:800">2</text>
<line x1="294" y1="678" x2="294" y2="726" class="ln" stroke-width="2"/>
<text x="330" y="654" class="t bd" text-anchor="start" style="font-weight:700">Download the model weights</text>
<text x="330" y="674" class="t sb" text-anchor="start">bernie can do this step.</text>
<rect x="330" y="668" width="300" height="10" rx="5" class="sf3"/>
<rect x="330" y="668" width="128" height="10" rx="5" class="key"/>
<text x="330" y="694" class="t sm" text-anchor="start">43% - 1.8 GB of 2.3 GB at 45.2 MB/s</text>
<rect x="660" y="662" width="60" height="26" rx="6" class="acc"/>
<text x="690" y="679" class="t onacc" text-anchor="middle" style="font-size:11px;font-weight:700">Run</text>
<line x1="276" y1="760" x2="1224" y2="760" class="ln"/>
<text x="276" y="782" class="t lbl" text-anchor="start">THE RECIPE</text>
<rect x="276" y="800" width="948" height="88" rx="18" class="sf" stroke="#dfe3e8"/>
<text x="296" y="826" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">Qwen3.8 Flash-Next AWQ + MTP=2</text>
<text x="296" y="848" class="t sm" text-anchor="start">fits: 4 GPUs of gfx1030, 28 GiB each - the plan lowers max-model-len to 32768 to fit the KV budget</text>
<rect x="1010" y="816" width="190" height="30" rx="9" class="sf3"/>
<text x="1040" y="836" class="t sb" text-anchor="middle" style="font-size:11px">host | container</text>
</svg>

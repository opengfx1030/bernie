<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="The Setup tab at 390 px">
<title>The Setup tab at 390 px</title>
<desc>The same page on a narrow screen.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="390" height="844" rx="0" class="bg"/>
<rect x="0" y="0" width="390" height="58" rx="0" class="sf"/>
<text x="16" y="26" class="t bd" text-anchor="start" style="font-size:15px;font-weight:800">bernie</text>
<line x1="0" y1="58" x2="390" y2="58" class="ln"/>
<rect x="270" y="18" width="52" height="24" rx="6" class="sf3" stroke="#828a93"/>
<text x="296" y="34" class="t sm" text-anchor="middle" style="font-size:10px">serving</text>
<rect x="16" y="34" width="53" height="20" rx="6" class="sf3" stroke="#828a93"/>
<text x="42.5" y="48" class="t sb" text-anchor="middle" style="font-size:11px">Setup</text>
<rect x="77" y="34" width="81" height="20" rx="6" class="sf" stroke="#828a93"/>
<text x="117.5" y="48" class="t sb" text-anchor="middle" style="font-size:11px">Dashboard</text>
<rect x="166" y="34" width="81" height="20" rx="6" class="sf" stroke="#828a93"/>
<text x="206.5" y="48" class="t sb" text-anchor="middle" style="font-size:11px">Benchmark</text>
<rect x="255" y="34" width="46" height="20" rx="6" class="sf" stroke="#828a93"/>
<text x="278.0" y="48" class="t sb" text-anchor="middle" style="font-size:11px">Logs</text>
<text x="16" y="110" class="t h2" text-anchor="start">SETUP</text>
<text x="19" y="142.24" class="t acc" text-anchor="start" style="font-size:21px;font-weight:900;letter-spacing:-.02em">3 STEPS LEFT BEFORE THIS BOX CAN SERVE</text>
<text x="16" y="142.24" class="t h1" text-anchor="start" style="font-size:21px">3 STEPS LEFT BEFORE THIS BOX CAN SERVE</text>
<text x="16" y="159.6" class="t sb" text-anchor="start" style="font-size:9px">The venv, the ROCm wheels and the model are not there yet.</text>
<rect x="19" y="175.0" width="190" height="34" rx="8" class="acc"/>
<rect x="16" y="172.0" width="190" height="34" rx="8" class="acc"/>
<text x="111.0" y="194.0" class="t onacc" text-anchor="middle" style="font-size:12px;font-weight:800;letter-spacing:.08em">SET UP THIS MACHINE</text>
<rect x="16" y="200" width="358" height="230" rx="18" class="sf" stroke="#dfe3e8"/>
<text x="32" y="228" class="t sb" text-anchor="start">bernie picked the setup that fits this host.</text>
<text x="32" y="248" class="t sm" text-anchor="start">Anything that needs a password is shown as a command.</text>
<text x="32" y="278" class="t lbl" text-anchor="start">GPUs</text>
<text x="110" y="278" class="t bd" text-anchor="start" style="font-size:14px;font-weight:700">8 x Radeon PRO V620</text>
<text x="110" y="294" class="t sm" text-anchor="start">one recipe family fits them all</text>
<text x="32" y="324" class="t lbl" text-anchor="start">Memory</text>
<text x="110" y="324" class="t bd" text-anchor="start" style="font-size:14px;font-weight:700">240 GiB</text>
<text x="110" y="340" class="t sm" text-anchor="start">28 GiB per card</text>
<text x="32" y="370" class="t lbl" text-anchor="start">ROCm</text>
<text x="110" y="370" class="t bd" text-anchor="start" style="font-size:14px;font-weight:700">7.14.0</text>
<text x="110" y="386" class="t sm" text-anchor="start">the one on PATH wins</text>
<text x="32" y="416" class="t lbl" text-anchor="start">Engine</text>
<text x="110" y="416" class="t bd" text-anchor="start" style="font-size:14px;font-weight:700">docker 29.9.0</text>
<text x="110" y="432" class="t sm" text-anchor="start">the image is used</text>
<line x1="16" y1="458" x2="374" y2="458" class="ln"/>
<text x="16" y="480" class="t lbl" text-anchor="start">THE PATH TO A SERVING MODEL</text>
<circle cx="34" cy="528" r="18" class="sf2"/>
<text x="34" y="532" class="t ok" text-anchor="middle" style="font-size:12px;font-weight:800">✓</text>
<line x1="34" y1="548" x2="34" y2="596" class="ln" stroke-width="2"/>
<text x="70" y="524" class="t bd" text-anchor="start" style="font-weight:700">The cards are there</text>
<text x="70" y="544" class="t sb" text-anchor="start">Every card is gfx1030 and /dev/kfd is readable.</text>
<circle cx="34" cy="608" r="18" class="sf2"/>
<text x="34" y="612" class="t warn" text-anchor="middle" style="font-size:12px;font-weight:800">!</text>
<line x1="34" y1="628" x2="34" y2="676" class="ln" stroke-width="2"/>
<text x="70" y="604" class="t bd" text-anchor="start" style="font-weight:700">Join the video and render groups</text>
<text x="70" y="624" class="t sb" text-anchor="start">This step needs root.</text>
<rect x="70" y="614" width="290" height="34" rx="8" class="sf2" stroke="#dfe3e8"/>
<text x="81" y="635" class="mn sb" text-anchor="start">sudo usermod -aG video,render $USER</text>
<rect x="298" y="620" width="52" height="22" rx="6" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="324" y="635" class="t sb" text-anchor="middle" style="font-size:11px">Copy</text>
<circle cx="34" cy="718" r="18" class="sf2"/>
<text x="34" y="722" class="t info" text-anchor="middle" style="font-size:12px;font-weight:800">2</text>
<line x1="34" y1="738" x2="34" y2="786" class="ln" stroke-width="2"/>
<text x="70" y="714" class="t bd" text-anchor="start" style="font-weight:700">Download the model weights</text>
<text x="70" y="734" class="t sb" text-anchor="start">bernie can do this step.</text>
<rect x="70" y="728" width="240" height="10" rx="5" class="sf3"/>
<rect x="70" y="728" width="100" height="10" rx="5" class="key"/>
<text x="16" y="790" class="t sm" text-anchor="start">The rail becomes a horizontal bar; the tiles go two across; nothing is hidden.</text>
</svg>

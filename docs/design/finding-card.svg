<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="The finding card">
<title>The finding card</title>
<desc>A known failure of the log doctor and its fix.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="280" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE FINDING CARD</text>
<rect x="32" y="56" width="656" height="140" rx="18" class="sf" stroke="#dfe3e8"/>
<rect x="52" y="76" width="66" height="22" rx="11" class="sf" stroke="currentColor" stroke-width="1" style="color:#b42318"/>
<text x="61" y="91" class="t fail" text-anchor="start">✕</text>
<text x="72" y="91" class="t fail" text-anchor="start">fail</text>
<text x="134" y="92" class="t mn bd" text-anchor="start" style="font-size:13px">engine.gpu-oom</text>
<text x="52" y="120" class="t sb" text-anchor="start">The run ran out of GPU memory while it loaded the weights.</text>
<text x="52" y="140" class="t sm" text-anchor="start">Lower the context length or use more cards.</text>
<rect x="52" y="156" width="420" height="34" rx="8" class="sf2" stroke="#dfe3e8"/>
<text x="63" y="177" class="mn sb" text-anchor="start">bernie up flashnext --set args.max-model-len=16384</text>
<rect x="410" y="162" width="52" height="22" rx="6" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="436" y="177" class="t sb" text-anchor="middle" style="font-size:11px">Copy</text>
<text x="490" y="172" class="t info" text-anchor="start">docs</text>
<text x="32" y="226" class="t sm" text-anchor="start">A finding is never a bare error code: the rule, the cause, the fix and the link.</text>
<text x="32" y="248" class="t sm" text-anchor="start">The severity is a pill with a word; the colour only helps.</text>
<text x="32" y="268" class="t sm" text-anchor="start">When there is no finding, the card says No known failure in this log.</text>
</svg>

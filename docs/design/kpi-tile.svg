<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="The KPI tile">
<title>The KPI tile</title>
<desc>A number with its unit, its context and a sparkline.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="260" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE KPI TILE</text>
<rect x="32" y="56" width="168" height="86" rx="16" class="sf" stroke="#dfe3e8"/>
<text x="46" y="80" class="t lbl" text-anchor="start">Output speed</text>
<circle cx="182" cy="76" r="7" class="sf3"/>
<text x="182" y="80" class="t sm" text-anchor="middle">i</text>
<text x="46" y="114" class="t num" text-anchor="start">56.1</text>
<text x="122" y="114" class="t sm" text-anchor="start">tok/s</text>
<text x="46" y="130" class="t sm" text-anchor="start">1-min avg 44.0 tok/s</text>
<polyline points="46.0,128 58.72727272727273,124 71.45454545454545,120 84.18181818181819,122 96.9090909090909,116 109.63636363636363,112 122.36363636363636,114 135.0909090909091,108 147.8181818181818,110 160.54545454545456,104 173.27272727272725,106 186.0,100" class="s1s" stroke-width="1.5"/>
<rect x="216" y="56" width="168" height="86" rx="16" class="sf" stroke="#dfe3e8"/>
<text x="230" y="80" class="t lbl" text-anchor="start">Power</text>
<circle cx="366" cy="76" r="7" class="sf3"/>
<text x="366" y="80" class="t sm" text-anchor="middle">i</text>
<text x="230" y="114" class="t num" text-anchor="start">1 240</text>
<text x="324" y="114" class="t sm" text-anchor="start">W</text>
<text x="230" y="130" class="t sm" text-anchor="start">of 1 400 W allowed</text>
<polyline points="230.0,124 242.72727272727272,122 255.45454545454544,120 268.1818181818182,118 280.9090909090909,116 293.6363636363636,118 306.3636363636364,114 319.0909090909091,112 331.8181818181818,110 344.54545454545456,112 357.27272727272725,108 370.0,106" class="s1s" stroke-width="1.5"/>
<rect x="400" y="56" width="168" height="86" rx="16" class="sf" stroke="#dfe3e8"/>
<text x="414" y="80" class="t lbl" text-anchor="start">KV cache</text>
<circle cx="550" cy="76" r="7" class="sf3"/>
<text x="550" y="80" class="t sm" text-anchor="middle">i</text>
<text x="414" y="114" class="t num" text-anchor="start">–</text>
<text x="436" y="114" class="t sm" text-anchor="start">%</text>
<text x="414" y="130" class="t sm" text-anchor="start">the server does not publish it</text>
<text x="32" y="170" class="t sm" text-anchor="start">The label, the number with its unit, one line of context and a 34 px sparkline.</text>
<text x="32" y="192" class="t sm" text-anchor="start">A value that was not measured shows a dash and a greyed unit, never a zero.</text>
<text x="32" y="214" class="t sm" text-anchor="start">The info mark opens a tooltip with the definition of the number.</text>
<text x="32" y="236" class="t sm" text-anchor="start">The tile never grows a second line of numbers.</text>
</svg>

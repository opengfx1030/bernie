<text x="966" y="276" class="t sm" text-anchor="start">One cell per prompt length, from 2048 to 16384.</text>
<text x="966" y="300" class="t sm" text-anchor="start">5 cells - about 12 min</text>
<text x="966" y="320" class="t mn sm" text-anchor="start">digest 5c2e9b07</text>
<text x="1204" y="320" class="t sb" text-anchor="end" style="font-size:10px">COPY</text>

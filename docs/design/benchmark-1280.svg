<text x="646" y="276" class="t sm" text-anchor="start">One short cell: it proves that the server answers.</text>
<text x="646" y="300" class="t sm" text-anchor="start">1 cell - about 10 s</text>
<text x="646" y="320" class="t mn sm" text-anchor="start">digest a71c04de</text>

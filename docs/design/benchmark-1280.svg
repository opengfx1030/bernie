<text x="276" y="56" class="t h2" text-anchor="start">BENCHMARK</text>
<text x="279" y="108.0" class="t acc" text-anchor="start" style="font-size:34px;font-weight:900;letter-spacing:-.02em">THE LAST BENCHMARK REACHED 56.1 TOK/S.</text>
<text x="276" y="108.0" class="t h1" text-anchor="start" style="font-size:34px">THE LAST BENCHMARK REACHED 56.1 TOK/S.</text>
<text x="276" y="136.0" class="t sb" text-anchor="start" style="font-size:15px">The pr suite measured 6 cells on 4 cards. The prefill was 2 310 tok/s and the decode 56.1 tok/s.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="The verdict chip">
<title>The verdict chip</title>
<desc>The verdict of one metric of one cell.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="200" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE VERDICT CHIP</text>
<rect x="32" y="72" width="80" height="22" rx="11" class="sf" stroke="currentColor" stroke-width="1" style="color:#1a7a33"/>
<text x="41" y="87" class="t ok" text-anchor="start">▲</text>
<text x="52" y="87" class="t ok" text-anchor="start">better</text>
<rect x="126" y="72" width="66" height="22" rx="11" class="sf" stroke="currentColor" stroke-width="1" style="color:#5f6874"/>
<text x="135" y="87" class="t skip" text-anchor="start">–</text>
<text x="146" y="87" class="t skip" text-anchor="start">same</text>
<rect x="206" y="72" width="73" height="22" rx="11" class="sf" stroke="currentColor" stroke-width="1" style="color:#b42318"/>
<text x="215" y="87" class="t fail" text-anchor="start">▼</text>
<text x="226" y="87" class="t fail" text-anchor="start">worse</text>
<rect x="293" y="72" width="73" height="22" rx="11" class="sf" stroke="currentColor" stroke-width="1" style="color:#8a6100"/>
<text x="302" y="87" class="t warn" text-anchor="start">!</text>
<text x="313" y="87" class="t warn" text-anchor="start">noisy</text>
<text x="32" y="120" class="t sm" text-anchor="start">The chip sits next to the number it judges, never alone.</text>
<text x="32" y="142" class="t sm" text-anchor="start">A metric without a verdict says so in words: the repetitions disagree.</text>
<text x="32" y="164" class="t sm" text-anchor="start">The colour follows the word: better is green, same is grey, worse is red, noisy is amber.</text>
</svg>

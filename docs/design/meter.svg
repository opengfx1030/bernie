<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="The meter">
<title>The meter</title>
<desc>A value against a maximum, with a cap tick.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="260" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE METER</text>
<text x="32" y="60" class="t lbl" text-anchor="start">MEMORY</text>
<text x="632" y="60" class="t sb" text-anchor="end">18.2 / 29.4 GiB</text>
<rect x="32" y="68" width="600" height="8" rx="4" class="sf3"/>
<rect x="32" y="68" width="371.42857142857144" height="8" rx="4" class="s1"/>
<text x="32" y="120" class="t lbl" text-anchor="start">POWER</text>
<text x="632" y="120" class="t sb" text-anchor="end">38 W of 175 W</text>
<rect x="32" y="128" width="600" height="8" rx="4" class="sf3"/>
<rect x="32" y="128" width="130.28571428571428" height="8" rx="4" class="s1"/>
<line x1="632.0" y1="126" x2="632.0" y2="138" class="ed" stroke-width="2"/>
<text x="32" y="180" class="t lbl" text-anchor="start">POWER, ABOVE THE CAP</text>
<text x="632" y="180" class="t sb" text-anchor="end">212 W of 175 W</text>
<rect x="32" y="188" width="600" height="8" rx="4" class="sf3"/>
<rect x="32" y="188" width="600.0" height="8" rx="4" class="ser"/>
<line x1="632.0" y1="186" x2="632.0" y2="198" class="ed" stroke-width="2"/>
<text x="32" y="220" class="t sm" text-anchor="start">The track is 8 px high with a 4 px radius; the fill carries the measure.</text>
<text x="32" y="240" class="t sm" text-anchor="start">The power meter draws the cap as a tick and says so in the caption: 38 W of 175 W.</text>
</svg>

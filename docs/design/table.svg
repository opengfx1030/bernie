<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="The table">
<title>The table</title>
<desc>The cells of a benchmark result.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="320" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE TABLE</text>
<text x="32" y="72" class="t lbl" text-anchor="start">Group</text>
<text x="200" y="72" class="t lbl" text-anchor="start">Conc.</text>
<text x="290" y="72" class="t lbl" text-anchor="end">Prefill tok/s</text>
<text x="420" y="72" class="t lbl" text-anchor="end">Decode tok/s</text>
<text x="540" y="72" class="t lbl" text-anchor="end">TTFT s</text>
<text x="650" y="72" class="t lbl" text-anchor="end">ITL ms</text>
<line x1="32" y1="82" x2="688" y2="82" class="ln"/>
<text x="32" y="110" class="t bd" text-anchor="start">1k</text>
<text x="200" y="110" class="t bd" text-anchor="start">1</text>
<text x="290" y="110" class="t bd" text-anchor="end">2 310</text>
<text x="420" y="110" class="t bd" text-anchor="end">56.1</text>
<text x="540" y="110" class="t bd" text-anchor="end">0.44</text>
<text x="650" y="110" class="t bd" text-anchor="end">18.2</text>
<line x1="32" y1="124" x2="688" y2="124" class="ln"/>
<text x="32" y="150" class="t bd" text-anchor="start">1k</text>
<text x="200" y="150" class="t bd" text-anchor="start">4</text>
<text x="290" y="150" class="t bd" text-anchor="end">2 180</text>
<text x="420" y="150" class="t bd" text-anchor="end">54.8</text>
<text x="540" y="150" class="t bd" text-anchor="end">0.51</text>
<text x="650" y="150" class="t bd" text-anchor="end">19.4</text>
<line x1="32" y1="164" x2="688" y2="164" class="ln"/>
<text x="32" y="190" class="t bd" text-anchor="start">1k</text>
<text x="200" y="190" class="t bd" text-anchor="start">8</text>
<text x="290" y="190" class="t bd" text-anchor="end">1 940</text>
<text x="420" y="190" class="t bd" text-anchor="end">52.0</text>
<text x="540" y="190" class="t bd" text-anchor="end">0.88</text>
<text x="650" y="190" class="t bd" text-anchor="end">21.0</text>
<line x1="32" y1="204" x2="688" y2="204" class="ln"/>
<text x="32" y="230" class="t bd" text-anchor="start">16k</text>
<text x="200" y="230" class="t bd" text-anchor="start">1</text>
<text x="290" y="230" class="t bd" text-anchor="end">410</text>
<text x="420" y="230" class="t bd" text-anchor="end">12.4</text>
<text x="540" y="230" class="t bd" text-anchor="end">6.20</text>
<text x="650" y="230" class="t bd" text-anchor="end">81.0</text>
<line x1="32" y1="244" x2="688" y2="244" class="ln"/>
<text x="32" y="300" class="t sm" text-anchor="start">The head is uppercase and 12 px; the numbers are right aligned with tabular figures.</text>
<text x="32" y="320" class="t sm" text-anchor="start">Every number carries its unit in the head of its column; a number that was not measured shows a dash.</text>
<text x="32" y="340" class="t sm" text-anchor="start">A wide table scrolls inside its card; the card never scrolls the page.</text>
</svg>

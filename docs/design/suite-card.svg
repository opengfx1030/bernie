<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="The suite card">
<title>The suite card</title>
<desc>A radio card that picks the suite of a run.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="280" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE SUITE CARD</text>
<rect x="32" y="56" width="656" height="120" rx="18" class="sf" stroke="#b3122c" stroke-width="2"/>
<circle cx="64" cy="96" r="11" class="sf" stroke="#b3122c" stroke-width="2"/>
<circle cx="64" cy="96" r="5" class="acc"/>
<text x="92" y="92" class="t bd" text-anchor="start" style="font-size:17px;font-weight:700">Pull request suite</text>
<text x="92" y="114" class="t sb" text-anchor="start">The cells a pull request must pass: 1024 and 16384 prompt tokens at the levels 1, 4 and 8.</text>
<text x="92" y="138" class="t sm" text-anchor="start">6 cells - about 6 min</text>
<text x="92" y="158" class="t mn sm" text-anchor="start">digest 3f9a2c1b</text>
<text x="660" y="160" class="t sb" text-anchor="end" style="font-size:11px">COPY</text>
<text x="32" y="206" class="t sm" text-anchor="start">A big radio, the name, one line of detail, the number of cells, the estimated time and the digest.</text>
<text x="32" y="228" class="t sm" text-anchor="start">The digest is the sha256 of the suite; two runs of different suites are never compared.</text>
<text x="32" y="250" class="t sm" text-anchor="start">States: picked, not picked, running (the card shows the progress), done (the card shows the result).</text>
<text x="32" y="270" class="t sm" text-anchor="start">The three built-in suites: pr, smoke and long-context.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="The Dashboard tab in Simple mode at 390 px">
<title>The Dashboard tab in Simple mode at 390 px</title>
<desc>The hero stacks, the six serving tiles are two across, and the charts and cards are full width.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#fff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}.ln{stroke:#dfe3e8}.ed{stroke:#828a93}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}.m{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.lbl{font-size:10px;font-weight:800;letter-spacing:.06em;fill:#5f6874}.h2{font-size:12px;font-weight:800;letter-spacing:.14em;fill:#5f6874}.bd{font-size:12px}.sm{font-size:10px;fill:#5f6874}.sb{font-size:11px;fill:#47505c}.num{font-size:25px;font-weight:900}.key{fill:#8a4f00}.ok{fill:#1a7a33}.s1{stroke:#2a78d6;fill:none}.s1f{fill:#2a78d6}.s3{stroke:#12795a;fill:none}
</style></defs>
<rect width="390" height="844" class="bg"/><rect width="390" height="54" class="sf"/><text x="16" y="32" class="t bd" font-weight="800">bernie</text><text x="250" y="32" class="t sb">Dashboard</text>
<rect x="16" y="108" width="358" height="238" rx="16" class="sf" stroke="#dfe3e8"/>
<rect x="32" y="126" width="66" height="22" rx="11" fill="#e7f5ea" stroke="#1a7a33"/><text x="65" y="141" class="t ok" text-anchor="middle" font-size="10">Serving</text><text x="108" y="141" class="t sm">port 18096</text><rect x="292" y="126" width="62" height="24" rx="7" class="sf" stroke="#828a93"/><text x="323" y="142" class="t sb" text-anchor="middle">Stop</text>
<text x="32" y="198" class="t key" font-size="43" font-style="italic" font-weight="900">SERVING</text><text x="34" y="222" class="t sb">smoke-tiny is answering requests on port 18096.</text><rect x="32" y="238" width="244" height="26" rx="6" class="sf2"/><text x="42" y="256" class="t m sm">http://127.0.0.1:18096/v1</text><rect x="282" y="238" width="72" height="26" rx="6" class="sf" stroke="#828a93"/><text x="318" y="256" class="t sb" text-anchor="middle">Copy URL</text>
<line x1="32" y1="278" x2="358" y2="278" class="ln"/><text x="32" y="299" class="t lbl">OUTPUT SPEED</text><text x="32" y="333" class="t key" font-size="40" font-weight="900">56.1</text><text x="90" y="333" class="t sb">tok/s</text>
<rect x="16" y="360" width="171" height="118" rx="14" class="sf" stroke="#dfe3e8"/><text x="30" y="384" class="t lbl">PROMPT READING</text><circle cx="171" cy="380" r="7" class="sf3"/><text x="171" y="384" class="t sm" text-anchor="middle">i</text><text x="30" y="423" class="t num">56</text><text x="62" y="423" class="t sm">tok/s</text><text x="30" y="445" class="t sm">reading the prompt</text><line x1="30" y1="464" x2="172" y2="464" class="s3" stroke-width="2"/>
<rect x="203" y="360" width="171" height="118" rx="14" class="sf" stroke="#dfe3e8"/><text x="217" y="384" class="t lbl">ACTIVE REQUESTS</text><circle cx="358" cy="380" r="7" class="sf3"/><text x="358" y="384" class="t sm" text-anchor="middle">i</text><text x="217" y="423" class="t num">2</text><text x="230" y="423" class="t sm">requests</text><text x="217" y="445" class="t sm">0 waiting in line</text><line x1="217" y1="464" x2="359" y2="464" class="s1" stroke-width="2"/>
<rect x="16" y="494" width="171" height="118" rx="14" class="sf" stroke="#dfe3e8"/><text x="30" y="518" class="t lbl">FIRST TOKEN</text><circle cx="171" cy="514" r="7" class="sf3"/><text x="171" y="518" class="t sm" text-anchor="middle">i</text><text x="30" y="557" class="t num">–</text><text x="46" y="557" class="t sm">s</text><text x="30" y="579" class="t sm">n/a on this host</text>
<rect x="203" y="494" width="171" height="118" rx="14" class="sf" stroke="#dfe3e8"/><text x="217" y="518" class="t lbl">KV CACHE</text><circle cx="358" cy="514" r="7" class="sf3"/><text x="358" y="518" class="t sm" text-anchor="middle">i</text><text x="217" y="557" class="t num">12</text><text x="246" y="557" class="t sm">%</text><text x="217" y="579" class="t sm">of GPU cache in use</text><line x1="217" y1="598" x2="359" y2="598" class="s3" stroke-width="2"/>
<rect x="16" y="628" width="171" height="100" rx="14" class="sf" stroke="#dfe3e8"/><text x="30" y="652" class="t lbl">PREFIX CACHE HITS</text><text x="30" y="688" class="t num">–</text><text x="46" y="688" class="t sm">%</text><text x="30" y="708" class="t sm">n/a on this host</text>
<rect x="203" y="628" width="171" height="100" rx="14" class="sf" stroke="#dfe3e8"/><text x="217" y="652" class="t lbl">DRAFT ACCEPTED</text><text x="217" y="688" class="t num">–</text><text x="233" y="688" class="t sm">%</text><text x="217" y="708" class="t sm">no draft tokens yet</text>
<text x="16" y="764" class="t h2">THE REQUEST RATES</text><rect x="16" y="780" width="358" height="48" rx="12" class="sf" stroke="#dfe3e8"/><text x="30" y="802" class="t bd" font-weight="700">Output speed</text><text x="116" y="802" class="t sm">tok/s, last 5 min</text><polyline points="30,820 80,806 130,812 180,798 230,806 280,792 330,800 360,794" class="s1" stroke-width="2"/>
</svg>

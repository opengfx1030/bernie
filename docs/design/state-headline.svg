<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="The state headline of a tab">
<title>The state headline of a tab</title>
<desc>The eyebrow, the headline, the lede and the actions of a tab.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="300" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE COMPONENTS</text>
<text x="35" y="77" class="t acc" text-anchor="start" style="font-size:26px;font-weight:900">3 STEPS LEFT BEFORE THIS BOX CAN SERVE</text>
<text x="32" y="74" class="t h1" text-anchor="start" style="font-size:26px">3 STEPS LEFT BEFORE THIS BOX CAN SERVE</text>
<text x="32" y="104" class="t sb" text-anchor="start" style="font-size:15px">The venv, the ROCm wheels and the model are not there yet. Two steps need root; you will run those yourself.</text>
<text x="32" y="140" class="t h2" text-anchor="start">SETUP</text>
<rect x="35" y="161" width="190" height="34" rx="8" class="acc"/>
<rect x="32" y="158" width="190" height="34" rx="8" class="acc"/>
<text x="127.0" y="180" class="t onacc" text-anchor="middle" style="font-size:12px;font-weight:800;letter-spacing:.08em">SET UP THIS MACHINE</text>
<rect x="232" y="160" width="150" height="30" rx="8" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="307.0" y="180" class="t sb" text-anchor="middle">COPY THE COMMAND</text>
<rect x="392" y="160" width="120" height="30" rx="8" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="452.0" y="180" class="t sb" text-anchor="middle">ADVANCED</text>
<text x="32" y="232" class="t sm" text-anchor="start">Anatomy: eyebrow, h1 (aria-live=polite), lede, one filled action and the ghost buttons.</text>
<text x="32" y="252" class="t sm" text-anchor="start">The headline says the situation in one sentence; the lede says what it means and what to do next.</text>
<text x="32" y="272" class="t sm" text-anchor="start">States: loading, ready, stale (a banner above it), error (the message, the endpoint, Try again).</text>
</svg>

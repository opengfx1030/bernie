<rect x="32" y="400" width="66" height="22" rx="11" class="sf" stroke="currentColor" stroke-width="1" style="color:#b42318"/>
<text x="41" y="415" class="t fail" text-anchor="start">✕</text>
<text x="52" y="415" class="t fail" text-anchor="start">fail</text>
<text x="114" y="416" class="t mn bd" text-anchor="start" style="font-size:12px">memory.kv-too-small</text>
<text x="32" y="444" class="t sb" text-anchor="start">The KV cache cannot hold 32 768 tokens.</text>
<rect x="32" y="460" width="320" height="34" rx="8" class="sf2" stroke="#dfe3e8"/>
<text x="43" y="481" class="mn sb" text-anchor="start">bernie up flashnext --set args.max-model-len=16384</text>
<rect x="290" y="466" width="52" height="22" rx="6" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="316" y="481" class="t sb" text-anchor="middle" style="font-size:11px">Copy</text>
<line x1="16" y1="560" x2="374" y2="560" class="ln"/>
<text x="16" y="582" class="t lbl" text-anchor="start">THE LOG</text>
<rect x="16" y="600" width="358" height="26" rx="9" class="sf3"/>

<text x="26" y="660" class="t mn" text-anchor="end" style="font-size:9px;fill:#6e7681">info</text>
<text x="32" y="676" class="t mn" text-anchor="start" style="font-size:11px;fill:#c9d1d9">INFO 10-28 12:01:04 api_server.py:93] Route: /v1/completions</text>
<text x="26" y="676" class="t mn" text-anchor="end" style="font-size:9px;fill:#6e7681">info</text>
<text x="32" y="692" class="t mn" text-anchor="start" style="font-size:11px;fill:#c9d1d9">INFO 10-28 12:01:11 worker.py:217] Loading model weights, 2 of 5 shards</text>
<text x="26" y="692" class="t mn" text-anchor="end" style="font-size:9px;fill:#6e7681">warn</text>
<text x="32" y="708" class="t mn" text-anchor="start" style="font-size:11px;fill:#c9d1d9">INFO 10-28 12:01:29 worker.py:217] Loading model weights, 3 of 5 shards</text>
<text x="26" y="708" class="t mn" text-anchor="end" style="font-size:9px;fill:#6e7681">info</text>
<rect x="22" y="712" width="346" height="16" rx="3" class="sf3" opacity="0.22"/>
<text x="32" y="724" class="t mn" text-anchor="start" style="font-size:11px;fill:#e3b341">WARNING 10-28 12:01:31 cache.py:88] KV cache size is smaller than expected</text>
<text x="26" y="724" class="t mn" text-anchor="end" style="font-size:9px;fill:#6e7681">info</text>
<text x="32" y="740" class="t mn" text-anchor="start" style="font-size:11px;fill:#c9d1d9">INFO 10-28 12:02:02 worker.py:301] Model loading took 58.3 seconds</text>
<text x="26" y="740" class="t mn" text-anchor="end" style="font-size:9px;fill:#6e7681">info</text>
<text x="16" y="844" class="t sm" text-anchor="start"></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="The toast">
<title>The toast</title>
<desc>A short confirmation at the bottom of the window.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="220" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE TOAST</text>
<rect x="240" y="80" width="240" height="40" rx="8" class="sf" stroke="#dfe3e8"/>
<text x="360" y="105" class="t sb" text-anchor="middle">Copied the command.</text>
<rect x="200" y="132" width="320" height="40" rx="8" class="sf" stroke="#dfe3e8"/>
<circle cx="224" cy="152" r="8" class="ok"/>
<text x="240" y="157" class="t sb" text-anchor="start">Power cap saved. The service applies it.</text>
<rect x="200" y="184" width="320" height="40" rx="8" class="sf" stroke="#dfe3e8"/>
<circle cx="224" cy="204" r="8" class="fail"/>
<text x="240" y="209" class="t sb" text-anchor="start">Stop failed: the run is already gone.</text>
<text x="32" y="60" class="t sm" text-anchor="start">Fixed at the bottom centre of the window, role=status, aria-live=polite.</text>
<text x="32" y="80" class="t sm" text-anchor="start">One at a time: a new toast replaces the old one. A click dismisses it. 2.6 s.</text>
</svg>

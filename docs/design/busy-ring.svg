<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="The busy ring">
<title>The busy ring</title>
<desc>The load of a card in a ring.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="260" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE BUSY RING</text>
<circle cx="110" cy="130" r="36" class="sf3"/>
<circle cx="110" cy="130" r="36" class="none" fill="none" stroke="#2a78d6" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2 226.2" stroke-dashoffset="11.3" transform="rotate(-90 110 130)"/>
<text x="110" y="132" class="t num" text-anchor="middle" style="font-size:22px">95</text>
<text x="110" y="184" class="t sm" text-anchor="middle">GPU 0</text>
<circle cx="250" cy="130" r="36" class="sf3"/>
<circle cx="250" cy="130" r="36" class="none" fill="none" stroke="#2a78d6" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2 226.2" stroke-dashoffset="119.9" transform="rotate(-90 250 130)"/>
<text x="250" y="132" class="t num" text-anchor="middle" style="font-size:22px">47</text>
<text x="250" y="184" class="t sm" text-anchor="middle">GPU 1</text>
<circle cx="390" cy="130" r="36" class="sf3"/>
<circle cx="390" cy="130" r="36" class="none" fill="none" stroke="#2a78d6" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2 226.2" stroke-dashoffset="226.2" transform="rotate(-90 390 130)"/>
<text x="390" y="132" class="t num" text-anchor="middle" style="font-size:22px">0</text>
<text x="390" y="184" class="t sm" text-anchor="middle">GPU 2</text>
<circle cx="530" cy="130" r="36" class="sf3"/>
<circle cx="530" cy="130" r="36" class="none" fill="none" stroke="#2a78d6" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2 226.2" stroke-dashoffset="226.2" transform="rotate(-90 530 130)"/>
<text x="530" y="132" class="t num" text-anchor="middle" style="font-size:22px">–</text>
<text x="530" y="184" class="t sm" text-anchor="middle">GPU 3</text>
<text x="86" y="110" class="t num" text-anchor="middle" style="font-size:22px">95</text>
<text x="32" y="226" class="t sm" text-anchor="start">An 84 px ring: the track, the arc, the number in the middle and the name of the card under it.</text>
<text x="32" y="246" class="t sm" text-anchor="start">A card that does not report its load shows a dash, not a zero.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="The Dashboard tab in Simple mode with nothing serving">
<title>The Dashboard tab in Simple mode with nothing serving</title>
<desc>The hero says NOT RUNNING, every unmeasured serving value is a dash, and the Connect an app block teaches how to start a run.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#fff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}.ln{stroke:#dfe3e8}.ed{stroke:#828a93}.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}.m{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}.h2{font-size:13px;font-weight:800;letter-spacing:.14em;fill:#5f6874}.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}.num{font-size:28px;font-weight:900}.key{fill:#8a4f00}.skip{fill:#5f6874}
</style></defs>
<rect width="1280" height="760" class="bg"/><rect width="220" height="760" class="sf"/><line x1="220" y1="0" x2="220" y2="760" class="ln"/><text x="24" y="44" class="t bd" font-weight="800">bernie</text><text x="24" y="64" class="t sm">gpu-box</text><rect x="14" y="94" width="192" height="32" rx="8" class="sf3"/><text x="26" y="115" class="t bd" font-weight="700">Dashboard</text><text x="24" y="156" class="t sb">Setup</text><text x="24" y="196" class="t sb">Benchmark</text><text x="24" y="236" class="t sb">Logs</text><text x="24" y="276" class="t sb">Advanced</text>
<rect x="270" y="72" width="950" height="188" rx="18" class="sf" stroke="#dfe3e8"/><rect x="294" y="94" width="66" height="24" rx="12" class="sf3"/><text x="327" y="110" class="t skip" text-anchor="middle" font-size="11">No run</text><text x="374" y="110" class="t sm">no run on this host</text><text x="294" y="176" class="t key" font-size="62" font-style="italic" font-weight="900">NOT RUNNING</text><text x="296" y="204" class="t sb">The model server is not running.</text><rect x="686" y="222" width="112" height="30" rx="7" fill="#b3122c"/><text x="742" y="242" class="t" fill="#fff" text-anchor="middle" font-size="11" font-weight="800">START A RUN</text><line x1="900" y1="94" x2="900" y2="238" class="ln"/><text x="928" y="116" class="t lbl">OUTPUT SPEED</text><text x="928" y="182" class="t key" font-size="62" font-weight="900">–</text><text x="954" y="182" class="t sb">tok/s</text><text x="928" y="208" class="t sm">No run is serving.</text>
<g>
<rect x="270" y="278" width="146" height="142" rx="16" class="sf" stroke="#dfe3e8"/><text x="286" y="304" class="t lbl">PROMPT READING</text><text x="286" y="350" class="t num">–</text><text x="302" y="350" class="t sm">tok/s</text><text x="286" y="374" class="t sm">n/a on this host</text>
<rect x="432" y="278" width="146" height="142" rx="16" class="sf" stroke="#dfe3e8"/><text x="448" y="304" class="t lbl">ACTIVE REQUESTS</text><text x="448" y="350" class="t num">–</text><text x="464" y="350" class="t sm">requests</text><text x="448" y="374" class="t sm">n/a on this host</text>
<rect x="594" y="278" width="146" height="142" rx="16" class="sf" stroke="#dfe3e8"/><text x="610" y="304" class="t lbl">FIRST TOKEN</text><text x="610" y="350" class="t num">–</text><text x="626" y="350" class="t sm">s</text><text x="610" y="374" class="t sm">n/a on this host</text>
<rect x="756" y="278" width="146" height="142" rx="16" class="sf" stroke="#dfe3e8"/><text x="772" y="304" class="t lbl">KV CACHE</text><text x="772" y="350" class="t num">–</text><text x="788" y="350" class="t sm">%</text><text x="772" y="374" class="t sm">n/a on this host</text>
<rect x="918" y="278" width="146" height="142" rx="16" class="sf" stroke="#dfe3e8"/><text x="934" y="304" class="t lbl">PREFIX CACHE HITS</text><text x="934" y="350" class="t num">–</text><text x="950" y="350" class="t sm">%</text><text x="934" y="374" class="t sm">n/a on this host</text>
<rect x="1080" y="278" width="140" height="142" rx="16" class="sf" stroke="#dfe3e8"/><text x="1096" y="304" class="t lbl">DRAFT ACCEPTED</text><text x="1096" y="350" class="t num">–</text><text x="1112" y="350" class="t sm">%</text><text x="1096" y="374" class="t sm">no draft tokens yet</text>
</g>
<rect x="270" y="440" width="468" height="200" rx="16" class="sf" stroke="#dfe3e8"/><text x="294" y="472" class="t bd" font-weight="700">Output speed</text><text x="400" y="472" class="t sm">tok/s, last 5 min</text><text x="294" y="512" class="t sb">No samples yet.</text><text x="294" y="530" class="t sm">The chart fills after the first minute.</text>
<rect x="754" y="440" width="466" height="200" rx="16" class="sf" stroke="#dfe3e8"/><text x="778" y="472" class="t bd" font-weight="700">Prompt reading</text><text x="892" y="472" class="t sm">tok/s, last 5 min</text><text x="778" y="512" class="t sb">No samples yet.</text><text x="778" y="530" class="t sm">The chart fills after the first minute.</text>
<line x1="270" y1="670" x2="1220" y2="670" class="ln"/><text x="270" y="700" class="t h2">GPUS</text><text x="340" y="700" class="t sm">No AMD GPU is visible to bernie.</text><rect x="270" y="718" width="950" height="42" rx="12" class="sf" stroke="#dfe3e8"/><text x="294" y="744" class="t sb">The amdgpu driver has to be loaded and /dev/kfd has to exist.</text>
</svg>

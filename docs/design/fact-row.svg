<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="The fact row">
<title>The fact row</title>
<desc>A label, a value and the reason under it.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="240" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE FACT ROW</text>
<text x="32" y="80" class="t lbl" text-anchor="start">GPUs</text>
<text x="32" y="104" class="t bd" text-anchor="start" style="font-size:17px;font-weight:700">8 x Radeon PRO V620</text>
<text x="32" y="126" class="t sm" text-anchor="start">Every card is gfx1030, so one recipe family fits them all.</text>
<text x="380" y="80" class="t lbl" text-anchor="start">Memory</text>
<text x="380" y="104" class="t bd" text-anchor="start" style="font-size:17px;font-weight:700">240 GiB</text>
<text x="380" y="126" class="t sm" text-anchor="start">The model needs 28 GiB per card; the rest is the KV cache.</text>
<text x="32" y="170" class="t sm" text-anchor="start">The hero: the facts on the right, separated by a hairline and not by boxes.</text>
<text x="32" y="192" class="t sm" text-anchor="start">A fact without a reason shows the value alone. A missing value shows a dash.</text>
<text x="32" y="214" class="t sm" text-anchor="start">The reason says why the value matters for the reader, never the mechanism.</text>
</svg>

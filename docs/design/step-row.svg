<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-label="The step timeline row">
<title>The step timeline row</title>
<desc>One step of the onboarding checklist and its states.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="720" height="430" rx="0" class="bg"/>
<text x="32" y="36" class="t h2" text-anchor="start">THE STEP TIMELINE ROW</text>
<circle cx="56" cy="74" r="18" class="sf2"/>
<text x="56" y="78" class="t ok" text-anchor="middle" style="font-size:12px;font-weight:800">✓</text>
<line x1="56" y1="94" x2="56" y2="144" class="ln" stroke-width="2"/>
<text x="92" y="70" class="t bd" text-anchor="start" style="font-weight:700">Create the venv</text>
<text x="92" y="90" class="t sb" text-anchor="start">The host build needs its own Python 3.12.</text>
<rect x="92" y="72" width="92" height="26" rx="6" class="sf" stroke="#828a93"/>
<text x="138" y="89" class="t sb" text-anchor="middle" style="font-size:11px">Run again</text>
<circle cx="56" cy="168" r="18" class="sf2"/>
<text x="56" y="172" class="t warn" text-anchor="middle" style="font-size:12px;font-weight:800">!</text>
<line x1="56" y1="188" x2="56" y2="238" class="ln" stroke-width="2"/>
<text x="92" y="164" class="t bd" text-anchor="start" style="font-weight:700">Join the video and render groups</text>
<text x="92" y="184" class="t sb" text-anchor="start">This step needs root. Run it in a terminal, then re-check.</text>
<rect x="92" y="168" width="430" height="34" rx="8" class="sf2" stroke="#dfe3e8"/>
<text x="103" y="189" class="mn sb" text-anchor="start">sudo usermod -aG video,render $USER</text>
<rect x="460" y="174" width="52" height="22" rx="6" class="sf" stroke="#828a93" stroke-width="1"/>
<text x="486" y="189" class="t sb" text-anchor="middle" style="font-size:11px">Copy</text>
<circle cx="56" cy="268" r="18" class="sf2"/>
<text x="56" y="272" class="t info" text-anchor="middle" style="font-size:12px;font-weight:800">◐</text>
<line x1="56" y1="288" x2="56" y2="338" class="ln" stroke-width="2"/>
<text x="92" y="264" class="t bd" text-anchor="start" style="font-weight:700">Download the model weights</text>
<text x="92" y="284" class="t sb" text-anchor="start">Downloading the model weights, 2 of 5 shards</text>
<rect x="92" y="282" width="300" height="10" rx="5" class="sf3"/>
<rect x="92" y="282" width="120" height="10" rx="5" class="key"/>
<text x="92" y="308" class="t sm" text-anchor="start">43%</text>
<text x="32" y="340" class="t sm" text-anchor="start">The states: done (a tick), todo (the number), running (a spin), blocked (!), skipped (a dash), failed (a cross).</text>
<text x="32" y="362" class="t sm" text-anchor="start">The word of the state is always next to the mark, in a pill.</text>
<text x="32" y="384" class="t sm" text-anchor="start">A step bernie can do has a Run button. A step that needs root has the command and no button.</text>
<text x="32" y="406" class="t sm" text-anchor="start">The log of a running step is a disclosure under the row; the output goes there.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="The Benchmark tab with no result">
<title>The Benchmark tab with no result</title>
<desc>The empty states of the tab.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="1280" height="760" rx="0" class="bg"/>
<line x1="220" y1="0" x2="220" y2="900" class="ln"/>
<text x="24" y="44" class="t bd" text-anchor="start" style="font-size:15px;font-weight:800">bernie</text>
<text x="24" y="64" class="t sm" text-anchor="start">gpu-box</text>
<line x1="24" y1="92" x2="196" y2="92" class="ln"/>
<text x="24" y="116" class="t sb" text-anchor="start" style="font-size:13px">Setup</text>
<text x="24" y="150" class="t sb" text-anchor="start" style="font-size:13px">Dashboard</text>
<rect x="14" y="162" width="192" height="30" rx="8" class="sf3"/>
<rect x="14" y="162" width="3" height="30" rx="0" class="acc"/>
<text x="24" y="184" class="t bd" text-anchor="start" style="font-size:13px;font-weight:700">Benchmark</text>
<text x="24" y="218" class="t sb" text-anchor="start" style="font-size:13px">Logs</text>
<line x1="24" y1="100" x2="196" y2="100" class="ln"/>
<rect x="24" y="122" width="86" height="22" rx="11" class="sf" stroke="#1a7a33" stroke-width="1"/>
<circle cx="36" cy="133" r="4" class="ok"/>
<text x="46" y="138" class="t ok" text-anchor="start" style="font-size:11px">serving</text>
<rect x="24" y="154" width="52" height="24" rx="6" class="sf" stroke="#828a93"/>
<text x="50" y="170" class="t sb" text-anchor="middle" style="font-size:11px">Dark</text>
<rect x="84" y="154" width="80" height="24" rx="6" class="sf" stroke="#828a93"/>
<text x="124" y="170" class="t sb" text-anchor="middle" style="font-size:11px">Advanced</text>
<text x="276" y="56" class="t h2" text-anchor="start">BENCHMARK</text>
<text x="279" y="108.0" class="t acc" text-anchor="start" style="font-size:34px;font-weight:900;letter-spacing:-.02em">NOTHING HAS BEEN MEASURED YET.</text>
<text x="276" y="108.0" class="t h1" text-anchor="start" style="font-size:34px">NOTHING HAS BEEN MEASURED YET.</text>
<text x="276" y="136.0" class="t sb" text-anchor="start" style="font-size:15px">A benchmark measures the tokens per second of a running server. Run one below and this page fills with its numbers.</text>
<rect x="279" y="159.0" width="150" height="34" rx="8" class="acc"/>
<rect x="276" y="156.0" width="150" height="34" rx="8" class="acc"/>
<text x="351.0" y="178.0" class="t onacc" text-anchor="middle" style="font-size:12px;font-weight:800;letter-spacing:.08em">RUN THE SUITE</text>
<line x1="276" y1="190" x2="1224" y2="190" class="ln"/>
<text x="276" y="212" class="t lbl" text-anchor="start">THE SUITES</text>
<rect x="276" y="230" width="304" height="110" rx="18" class="sf" stroke="#b3122c" stroke-width="2"/>
<circle cx="304" cy="260" r="10" class="sf" stroke="#b3122c" stroke-width="2"/>
<circle cx="304" cy="260" r="5" class="acc"/>
<text x="326" y="256" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">Pull request suite</text>
<text x="326" y="276" class="t sm" text-anchor="start">The cells a pull request must pass.</text>
<text x="326" y="300" class="t sm" text-anchor="start">6 cells - about 6 min</text>
<text x="326" y="320" class="t mn sm" text-anchor="start">digest 3f9a2c1b</text>
<text x="564" y="320" class="t sb" text-anchor="end" style="font-size:10px">COPY</text>
<rect x="596" y="230" width="304" height="110" rx="18" class="sf" stroke="#dfe3e8"/>
<circle cx="624" cy="260" r="10" class="sf" stroke="#b3122c" stroke-width="2"/>
<text x="646" y="256" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">Smoke suite</text>
<text x="646" y="276" class="t sm" text-anchor="start">One short cell: it proves that the server answers.</text>
<text x="646" y="300" class="t sm" text-anchor="start">1 cell - about 10 s</text>
<text x="646" y="320" class="t mn sm" text-anchor="start">digest a71c04de</text>
<text x="884" y="320" class="t sb" text-anchor="end" style="font-size:10px">COPY</text>
<rect x="916" y="230" width="304" height="110" rx="18" class="sf" stroke="#dfe3e8"/>
<circle cx="944" cy="260" r="10" class="sf" stroke="#b3122c" stroke-width="2"/>
<text x="966" y="256" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">Long context ladder</text>
<text x="966" y="276" class="t sm" text-anchor="start">One cell per prompt length, from 2048 to 16384.</text>
<text x="966" y="300" class="t sm" text-anchor="start">5 cells - about 12 min</text>
<text x="966" y="320" class="t mn sm" text-anchor="start">digest 5c2e9b07</text>
<text x="1204" y="320" class="t sb" text-anchor="end" style="font-size:10px">COPY</text>
<line x1="276" y1="380" x2="1224" y2="380" class="ln"/>
<text x="276" y="402" class="t lbl" text-anchor="start">THE RESULT</text>
<rect x="276" y="420" width="948" height="140" rx="18" class="sf" stroke="#dfe3e8"/>
<text x="296" y="458" class="t bd" text-anchor="start" style="font-size:16px;font-weight:700">No result yet.</text>
<text x="296" y="480" class="t sb" text-anchor="start">Run a suite above to fill this table.</text>
<text x="296" y="506" class="t sm" text-anchor="start">Every benchmark is saved with its workload, so two results can be compared only when they measured the same thing.</text>
<line x1="276" y1="600" x2="1224" y2="600" class="ln"/>
<text x="276" y="622" class="t lbl" text-anchor="start">THE HISTORY</text>
<rect x="276" y="640" width="948" height="60" rx="18" class="sf" stroke="#dfe3e8"/>
<text x="296" y="676" class="t sb" text-anchor="start">No saved result yet.</text>
</svg>

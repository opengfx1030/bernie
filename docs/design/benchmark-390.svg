<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="The Benchmark tab at 390 px">
<title>The Benchmark tab at 390 px</title>
<desc>The suites and the result on a narrow screen.</desc>
<defs><style>
.bg{fill:#f4f5f7}.sf{fill:#ffffff}.sf2{fill:#eef1f5}.sf3{fill:#e4e8ee}
.ln{stroke:#dfe3e8;fill:none}.ed{stroke:#828a93;fill:none}.accln{stroke:#b3122c;fill:none}
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#14181d}
.mn{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#14181d}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}.h2{font-size:14px;font-weight:800;letter-spacing:.14em;fill:#5f6874}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;fill:#5f6874}
.bd{font-size:13px}.sm{font-size:11px;fill:#5f6874}.sb{font-size:12px;fill:#47505c}
.num{font-size:30px;font-weight:900}.hnum{font-size:52px;font-weight:900}
.key{fill:#8a4f00}.acc{fill:#b3122c}.onacc{fill:#ffffff}
.ok{fill:#1a7a33}.warn{fill:#8a6100}.ser{fill:#c2410c}.fail{fill:#b42318}.skip{fill:#5f6874}.info{fill:#2a5fb4}
.s1{fill:#2a78d6}.s2{fill:#12795a}.s3{fill:#9a6200}.s4{fill:#c0392b}.s5{fill:#7c5cff}.s6{fill:#0f766e}
.s1s{stroke:#2a78d6;fill:none}.s2s{stroke:#12795a;fill:none}
</style></defs>
<rect x="0" y="0" width="390" height="844" rx="0" class="bg"/>
<rect x="0" y="0" width="390" height="58" rx="0" class="sf"/>
<text x="16" y="26" class="t bd" text-anchor="start" style="font-size:15px;font-weight:800">bernie</text>
<line x1="0" y1="58" x2="390" y2="58" class="ln"/>
<rect x="270" y="18" width="52" height="24" rx="6" class="sf3" stroke="#828a93"/>
<text x="296" y="34" class="t sm" text-anchor="middle" style="font-size:10px">serving</text>
<rect x="16" y="34" width="53" height="20" rx="6" class="sf" stroke="#828a93"/>
<text x="42.5" y="48" class="t sb" text-anchor="middle" style="font-size:11px">Setup</text>
<rect x="77" y="34" width="81" height="20" rx="6" class="sf" stroke="#828a93"/>
<text x="117.5" y="48" class="t sb" text-anchor="middle" style="font-size:11px">Dashboard</text>
<rect x="166" y="34" width="81" height="20" rx="6" class="sf3" stroke="#828a93"/>
<text x="206.5" y="48" class="t sb" text-anchor="middle" style="font-size:11px">Benchmark</text>
<rect x="255" y="34" width="46" height="20" rx="6" class="sf" stroke="#828a93"/>
<text x="278.0" y="48" class="t sb" text-anchor="middle" style="font-size:11px">Logs</text>
<text x="16" y="110" class="t h2" text-anchor="start">BENCHMARK</text>
<text x="19" y="142.24" class="t acc" text-anchor="start" style="font-size:21px;font-weight:900;letter-spacing:-.02em">THE LAST BENCHMARK REACHED 56.1 TOK/S.</text>
<text x="16" y="142.24" class="t h1" text-anchor="start" style="font-size:21px">THE LAST BENCHMARK REACHED 56.1 TOK/S.</text>
<text x="16" y="159.6" class="t sb" text-anchor="start" style="font-size:9px">The pr suite measured 6 cells on 4 cards.</text>
<rect x="19" y="175.0" width="140" height="34" rx="8" class="acc"/>
<rect x="16" y="172.0" width="140" height="34" rx="8" class="acc"/>
<text x="86.0" y="194.0" class="t onacc" text-anchor="middle" style="font-size:12px;font-weight:800;letter-spacing:.08em">RUN THE SUITE</text>
<line x1="16" y1="200" x2="374" y2="200" class="ln"/>
<text x="16" y="222" class="t lbl" text-anchor="start">THE SUITES</text>
<rect x="16" y="240" width="358" height="104" rx="18" class="sf" stroke="#b3122c" stroke-width="2"/>
<circle cx="44" cy="270" r="10" class="sf" stroke="#b3122c" stroke-width="2"/>
<circle cx="44" cy="270" r="5" class="acc"/>
<text x="66" y="266" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">Pull request suite</text>
<text x="66" y="286" class="t sm" text-anchor="start">The cells a pull request must pass.</text>
<text x="66" y="310" class="t sm" text-anchor="start">6 cells - about 6 min</text>
<text x="66" y="330" class="t mn sm" text-anchor="start">digest 3f9a2c1b</text>
<text x="358" y="330" class="t sb" text-anchor="end" style="font-size:10px">COPY</text>
<rect x="16" y="356" width="358" height="104" rx="18" class="sf" stroke="#dfe3e8"/>
<circle cx="44" cy="386" r="10" class="sf" stroke="#b3122c" stroke-width="2"/>
<text x="66" y="382" class="t bd" text-anchor="start" style="font-size:15px;font-weight:700">Smoke suite</text>
<text x="66" y="402" class="t sm" text-anchor="start">One short cell: it proves that the server answers.</text>
<text x="66" y="426" class="t sm" text-anchor="start">1 cell - about 10 s</text>
<text x="66" y="446" class="t mn sm" text-anchor="start">digest a71c04de</text>
<text x="358" y="446" class="t sb" text-anchor="end" style="font-size:10px">COPY</text>
<line x1="16" y1="490" x2="374" y2="490" class="ln"/>
<text x="16" y="512" class="t lbl" text-anchor="start">THE RESULT</text>
<rect x="16" y="530" width="358" height="30" rx="9" class="sf3"/>
<text x="195" y="550" class="t sb" text-anchor="middle">pr - 6 cells</text>
<rect x="16" y="568" width="358" height="180" rx="18" class="sf" stroke="#dfe3e8"/>
<text x="32" y="594" class="t lbl" text-anchor="start">Group</text>
<text x="150" y="594" class="t lbl" text-anchor="end">Prefill tok/s</text>
<text x="250" y="594" class="t lbl" text-anchor="end">Decode tok/s</text>
<text x="350" y="594" class="t lbl" text-anchor="end">TTFT s</text>
<line x1="32" y1="602" x2="358" y2="602" class="ln"/>
<text x="32" y="628" class="t bd" text-anchor="start">1k @ 1</text>
<text x="150" y="628" class="t bd" text-anchor="end">2 310</text>
<text x="250" y="628" class="t bd" text-anchor="end">56.1</text>
<text x="350" y="628" class="t bd" text-anchor="end">0.44</text>
<line x1="32" y1="636" x2="358" y2="636" class="ln"/>
<text x="32" y="658" class="t bd" text-anchor="start">1k @ 4</text>
<text x="150" y="658" class="t bd" text-anchor="end">2 180</text>
<text x="250" y="658" class="t bd" text-anchor="end">54.8</text>
<text x="350" y="658" class="t bd" text-anchor="end">0.51</text>
<line x1="32" y1="666" x2="358" y2="666" class="ln"/>
<text x="32" y="688" class="t bd" text-anchor="start">1k @ 8</text>
<text x="150" y="688" class="t bd" text-anchor="end">1 940</text>
<text x="250" y="688" class="t bd" text-anchor="end">52.0</text>
<text x="350" y="688" class="t bd" text-anchor="end">0.88</text>
<line x1="32" y1="696" x2="358" y2="696" class="ln"/>
<text x="16" y="780" class="t sm" text-anchor="start">The table scrolls inside its card; the card never scrolls the page.</text>
</svg>
